name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Cover supported Go versions on Linux and portability once per
        # non-Linux OS. A Cartesian Go x OS matrix only repeats the generated
        # model suite and makes a cold macOS build take over an hour.
        include:
          - arch: amd64
            runner: ubuntu-latest
            go: "oldstable"
            flags: ""

          - arch: amd64
            runner: ubuntu-latest
            go: "stable"
            flags: ""

          - arch: amd64
            runner: macos-latest
            go: "oldstable"
            flags: ""

          - arch: amd64
            runner: windows-latest
            go: "stable"
            flags: "-p=1"

          - arch: amd64
            go: "stable"
            runner: ubuntu-latest
            flags: "-race"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Get Go environment
        id: go-env
        shell: bash
        run: |
          echo "cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Set up cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-env.outputs.cache }}
            ${{ steps.go-env.outputs.modcache }}
          key: test-${{ runner.os }}-${{ matrix.arch }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            test-${{ runner.os }}-${{ matrix.arch }}-go-${{ matrix.go }}-

      - name: Run tests
        env:
          GOARCH: ${{ matrix.arch }}
          GOFLAGS: ${{ matrix.flags }}
        run: go test --timeout 15m ./...
